name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y pandoc zip
      - run: npm ci
      - run: npm run db:keys
      - run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor
      - run: npm test
