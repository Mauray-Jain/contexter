<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feed · contexter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>try{var t=localStorage.getItem("contexter-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <script src="config.js"></script>
</head>
<body>
<div id="main"><p class="muted" style="padding:24px">Loading…</p></div>
<dialog id="unit"><h2 id="unit-title"></h2><p id="unit-meta" class="muted"></p><pre id="unit-body"></pre>
  <div class="actions"><button type="button" onclick="this.closest('dialog').close()">Close</button></div></dialog>
<script type="module">
  // Live team feed: what teammates and their Claudes did, who is active, units and reasoning,
  // updated through Supabase Realtime.
  import { ago, appShell, avatar, el, emptyMark, personColor, requireSignIn, sb, setCommands, transition } from "./app.js";

  const main = document.getElementById("main");
  const user = await requireSignIn(main);
  const LETTER = { decision: "D", rationale: "R", alternative: "A", finding: "F", question: "Q", session: "S" };
  const recRef = (r) => `${LETTER[r.type]}-${String(r.number).padStart(4, "0")}`;

  const shell = appShell(main, user, "feed");
  const { data: memberships } = await sb.from("members").select("handle, workspaces(id, slug, name)").eq("user_id", user.id);
  if (!memberships?.length) {
    shell.setHeader({ title: "Feed", subtitle: "Your team's activity shows up here." });
    shell.content.replaceChildren(el("section", { class: "card" }, el("div", { class: "empty" }, emptyMark("feed"),
      el("h3", {}, "You are not in a project yet"),
      el("p", {}, "Ask a team admin to invite you, or create a team of your own and add a project."),
      el("div", { class: "row", style: "margin:8px 0 0" }, el("a", { class: "btn btn-primary", href: "team/" }, "Set up a team")))));
    throw new Error("no workspaces");
  }
  const { data: profile } = await sb.from("profiles").select("active_workspace").eq("user_id", user.id).maybeSingle();
  const pick = new URLSearchParams(location.search).get("w");
  let ws = (memberships.find((m) => m.workspaces.slug === pick) ?? memberships.find((m) => m.workspaces.id === profile?.active_workspace) ?? memberships[0]).workspaces;

  const feedList = el("ul", { class: "feed", "aria-live": "polite" });
  const presence = el("div");
  const unitsBody = el("tbody");
  const unitsEmpty = el("p", { class: "muted", hidden: true, style: "margin:0" }, "No shared units yet.");
  const questions = el("ul", { class: "plain" });
  const decisions = el("ul", { class: "plain" });
  const memory = el("p", { class: "memory" });
  let handles = new Map();
  let myHandle = "";
  let channel;

  const select = el("select", { "aria-label": "Project", onchange: (e) => {
    ws = memberships.find((m) => m.workspaces.slug === e.target.value).workspaces;
    history.replaceState(null, "", `?w=${ws.slug}`);
    transition(() => { load(); });
  } }, memberships.map((m) => el("option", { value: m.workspaces.slug, selected: m.workspaces.id === ws.id }, m.workspaces.name)));

  // The feed is the page; everything else lives in one quiet rail beside it.
  const railPart = (title, body) => el("section", {}, el("h2", {}, title), el("div", { class: "rail-body" }, body));
  shell.content.replaceChildren(el("div", { class: "layout-2" },
    el("section", { class: "card" }, el("div", { class: "card-head" }, el("h2", {}, "Team feed"), el("span", { class: "live", title: "New activity appears as it happens" }, el("i"), "Live")), feedList),
    el("aside", { class: "rail" },
      railPart("Active now", presence),
      railPart("Open questions", questions),
      railPart("Decisions", decisions),
      railPart("Units", el("div", {}, el("div", { class: "table-wrap", id: "units-table" }, el("table", {},
        el("thead", {}, el("tr", {}, ["Unit", "Status", "Ver."].map((h) => el("th", {}, h)))), unitsBody)), unitsEmpty)),
      railPart("Team memory", memory))));

  function setHeader(summary) {
    shell.setHeader({ title: ws.name, subtitle: summary, actions: [el("label", {}, "Project", select)] });
  }

  function describe(e) {
    const p = e.payload ?? {};
    const unit = p.collection ? `${p.collection}/${p.key}` : "a unit";
    switch (e.kind) {
      case "prompt": return `asked: “${p.text}”`;
      case "reply": return `→ their Claude: ${p.summary || p.text || ""}${p.files?.length ? ` [${p.files.slice(0, 4).join(", ")}]` : ""}`;
      case "edit": return `edited ${unit} (v${p.from}→v${p.to}): ${p.summary}`;
      case "record": return `recorded ${recRef(p)} ${p.type}: ${p.title}`;
      case "status": return p.action === "created" ? `created ${unit}` : `moved ${unit} ${p.from} → ${p.to}`;
      case "lock": return p.action === "claimed" ? `is editing ${unit}` : p.action === "broken" ? `broke the lock on ${unit}` : `released ${unit}`;
      case "mention": return `to ${(e.mentions ?? []).map((h) => "@" + h).join(" ")}: “${p.text}”`;
      case "member": return `${p.action} the project`;
      case "presence": return p.action === "started" ? `opened a ${p.client} session` : `closed their ${p.client} session`;
      case "compaction": return `updated the team memory (v${p.version})`;
      default: return e.kind;
    }
  }

  function feedItem(e, fresh = false, i = 0) {
    const mine = e.author_id === user.id;
    const name = mine ? "you" : handles.get(e.author_id) ?? "someone";
    const cls = [(e.mentions ?? []).includes(myHandle) ? "mention" : "", fresh ? "new" : ""].join(" ").trim();
    return el("li", { class: [cls, fresh ? "" : "enter"].join(" ").trim() || null, style: `--c:${personColor(mine ? user.email : name)};--i:${Math.min(i, 10)}` }, avatar(mine ? user.email : name),
      el("div", { class: "body" }, el("span", { class: "who" }, name), " ", describe(e)),
      el("span", { class: "when", title: e.created_at }, ago(e.created_at)));
  }

  async function openUnit(u) {
    const { data } = await sb.from("unit_versions").select("content, summary, author_id, created_at").eq("unit_id", u.id).eq("version", u.current_version).maybeSingle();
    document.getElementById("unit-title").textContent = `${u.collection}/${u.key}`;
    document.getElementById("unit-meta").textContent = data
      ? `v${u.current_version} · ${u.status} · last change by ${handles.get(data.author_id) ?? "?"} ${ago(data.created_at)}: ${data.summary}`
      : "No content yet.";
    document.getElementById("unit-body").textContent = data?.content ?? "";
    document.getElementById("unit").showModal();
  }

  const none = (text) => el("li", { class: "muted" }, text);

  async function refreshSide() {
    const now = new Date().toISOString();
    const [units, sessions, recs, mem] = await Promise.all([
      sb.from("units").select("*").eq("workspace_id", ws.id).order("collection").order("position", { nullsFirst: false }).order("key"),
      sb.from("sessions").select("user_id, client, title, last_seen_at").eq("workspace_id", ws.id).is("ended_at", null)
        .gt("last_seen_at", new Date(Date.now() - 15 * 60_000).toISOString()).order("last_seen_at", { ascending: false }),
      sb.from("records").select("type, number, title, status").eq("workspace_id", ws.id).in("type", ["question", "decision"]).order("number", { ascending: false }),
      sb.rpc("memory_status", { p_workspace: ws.id }).single(),
    ]);
    const unitRows = units.data ?? [];
    unitsEmpty.hidden = unitRows.length > 0;
    document.getElementById("units-table").hidden = unitRows.length === 0;
    unitsBody.replaceChildren(...unitRows.map((u) => el("tr", {},
      el("td", { class: "ref" }, el("button", { type: "button", onclick: () => openUnit(u) }, `${u.collection}/${u.key}`)),
      el("td", {}, u.lock_holder && u.lock_expires_at > now
        ? el("span", { class: "badge warn" }, `${handles.get(u.lock_holder) ?? "?"} editing`) : el("span", { class: "badge" }, u.status)),
      el("td", { class: "num" }, `v${u.current_version}`))));

    const active = sessions.data ?? [];
    presence.replaceChildren(active.length
      ? el("div", { style: "display:grid;gap:10px" }, active.map((s) => {
          const name = s.user_id === user.id ? "you" : handles.get(s.user_id) ?? "someone";
          return el("div", { class: "cell-person" }, el("span", { class: "avatar-live" }, avatar(s.user_id === user.id ? user.email : name)),
            el("div", {}, el("b", {}, name), el("span", {}, `${s.client}${s.title ? ` · ${s.title}` : ""} · ${ago(s.last_seen_at)}`)));
        }))
      : el("p", { class: "muted", style: "margin:0" }, "Nobody has been active in the last 15 minutes."));

    const qs = (recs.data ?? []).filter((r) => r.type === "question" && r.status === "open");
    const ds = (recs.data ?? []).filter((r) => r.type === "decision").slice(0, 8);
    questions.replaceChildren(...(qs.length ? qs.map((r) => el("li", {}, el("span", { class: "badge" }, recRef(r)), r.title)) : [none("Nothing open right now.")]));
    decisions.replaceChildren(...(ds.length ? ds.map((r) => el("li", {}, el("span", { class: "badge" }, recRef(r)), el("span", { style: "flex:1" }, r.title),
      el("span", { class: `badge ${r.status === "accepted" ? "ok" : ""}` }, r.status))) : [none("None yet.")]));
    memory.textContent = mem.data?.summary ?? "No summary yet. Claude writes one once the feed gets long.";
    const people = active.length === 0 ? "Nobody is active right now" : `${active.length} ${active.length === 1 ? "person is" : "people are"} active right now`;
    setHeader(`${people}, with ${qs.length === 0 ? "no open questions" : `${qs.length} open question${qs.length === 1 ? "" : "s"}`}.`);
  }

  async function load() {
    const { data: members } = await sb.from("members").select("user_id, handle").eq("workspace_id", ws.id);
    handles = new Map((members ?? []).map((m) => [m.user_id, m.handle]));
    myHandle = handles.get(user.id) ?? "";
    const { data: events } = await sb.from("events").select("*").eq("workspace_id", ws.id)
      .neq("kind", "presence").order("id", { ascending: false }).limit(60);
    feedList.replaceChildren(...(events ?? []).map((e, i) => feedItem(e, false, i)));
    if (!events?.length) feedList.replaceChildren(el("li", {}, el("div", { class: "empty", style: "width:100%" }, emptyMark("feed"),
      el("h3", {}, "Quiet so far"), el("p", {}, "When a teammate or their Claude asks, edits or decides something, it lands here the moment it happens."))));
    await refreshSide();

    if (channel) await sb.removeChannel(channel);
    channel = sb.channel(`dash-${ws.id}`)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "events", filter: `workspace_id=eq.${ws.id}` }, ({ new: e }) => {
        if (e.kind !== "presence") {
          if (feedList.querySelector(".empty")) feedList.replaceChildren();
          feedList.prepend(feedItem(e, true));
        }
        refreshSide();
      })
      .on("postgres_changes", { event: "*", schema: "public", table: "units", filter: `workspace_id=eq.${ws.id}` }, refreshSide)
      .subscribe();
  }

  setCommands(memberships.map((m) => ({ label: `Switch to ${m.workspaces.name}`, icon: "folder", run: () => {
    select.value = m.workspaces.slug; select.dispatchEvent(new Event("change")); } })));
  setHeader("Loading…");
  await load();
  setInterval(refreshSide, 60_000); // keeps "x minutes ago" and presence honest
</script>
</body>
</html>
