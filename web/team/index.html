<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team · contexter</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../config.js"></script>
</head>
<body>
<main id="main" class="page"><p class="muted">Loading…</p></main>
<script type="module">
  // Team management: create a team, see its projects and people, invite by email, and set
  // project access. Everything goes through the database functions, so the page can only do
  // what the signed-in person is allowed to do.
  import { callFunction, command, el, requireSignIn, sb, signOut } from "../app.js";

  const main = document.getElementById("main");
  const user = await requireSignIn(main, { title: "Sign in to manage your team" });

  const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
  const flash = el("p", { role: "status", "aria-live": "polite", class: "muted" });
  const say = (msg, bad = false) => { flash.textContent = msg; flash.className = bad ? "status-err" : "status-ok"; };
  const run = async (fn) => {
    try { await fn(); } catch (e) { say(e.message ?? String(e), true); return false; }
    return true;
  };
  const rpc = async (name, args) => {
    const { data, error } = await sb.rpc(name, args);
    if (error) throw new Error(error.message);
    return data;
  };

  let teams = [];
  let team = null;       // the selected team
  let myRole = "member";

  async function loadTeams() {
    const [{ data: ts }, { data: mine }] = await Promise.all([
      sb.from("teams").select("*").order("name"),
      sb.from("team_members").select("team_id, role").eq("user_id", user.id),
    ]);
    teams = (ts ?? []).map((t) => ({ ...t, myRole: (mine ?? []).find((m) => m.team_id === t.id)?.role ?? "member" }));
    const want = new URLSearchParams(location.search).get("t");
    team = teams.find((t) => t.slug === want) ?? teams.find((t) => t.id === team?.id) ?? teams[0] ?? null;
    myRole = team?.myRole ?? "member";
  }

  const bar = () => el("header", { class: "bar" }, el("h1", {}, "Teams"),
    teams.length ? el("select", { "aria-label": "Team", onchange: (e) => {
      history.replaceState(null, "", `?t=${e.target.value}`); render(); } },
      teams.map((t) => el("option", { value: t.slug, selected: t.id === team?.id }, t.name))) : null,
    el("span", { class: "spacer" }), el("a", { href: "../" }, "Live dashboard"),
    el("span", { class: "muted" }, user.email), el("button", { type: "button", onclick: signOut }, "Sign out"));

  function createTeamCard() {
    const name = el("input", { required: true, placeholder: "Acme research lab", "aria-label": "Team name", maxlength: 200 });
    const slug = el("input", { required: true, placeholder: "acme-lab", "aria-label": "Team URL name", pattern: "[a-z0-9][a-z0-9\\-]{1,48}" });
    let edited = false;
    slug.addEventListener("input", () => (edited = true));
    name.addEventListener("input", () => { if (!edited) slug.value = slugify(name.value); });
    return el("section", { class: "card narrow" }, el("h1", {}, teams.length ? "Create another team" : "Create your team"),
      el("p", { class: "muted" }, "A team holds your projects and people. You can invite teammates by email and choose which projects each can open."),
      el("form", { onsubmit: async (e) => {
        e.preventDefault();
        if (await run(async () => { await rpc("create_team", { p_slug: slug.value.trim(), p_name: name.value.trim() }); })) {
          history.replaceState(null, "", `?t=${slug.value.trim()}`);
          await loadTeams(); render(); say("Team created.");
        }
      } }, el("label", { class: "field" }, "Team name", name),
        el("label", { class: "field" }, "Short name", el("span", { class: "hint" }, "Lowercase letters, numbers and dashes."), slug),
        el("button", { type: "submit", class: "primary" }, "Create team")));
  }

  async function render() {
    if (!team) {
      main.replaceChildren(bar(), createTeamCard(), flash);
      return;
    }
    if (myRole === "member") return renderMember();
    const overview = await rpc("team_overview", { p_team: team.id });
    const { data: invites } = await sb.from("email_invites").select("*").eq("team_id", team.id).eq("status", "pending").order("created_at", { ascending: false });
    main.replaceChildren(bar(), el("div", { class: "stack-lg" }, flash,
      projectsCard(overview), peopleCard(overview),
      el("div", { class: "cards-2" }, inviteCard(overview), pendingCard(invites ?? [], overview)),
      settingsCard()));
  }

  async function renderMember() {
    const { data } = await sb.from("members").select("role, workspaces(slug, name, team_id)").eq("user_id", user.id);
    const mine = (data ?? []).filter((m) => m.workspaces?.team_id === team.id);
    main.replaceChildren(bar(), el("section", { class: "card" }, el("h2", {}, `Your projects in ${team.name}`),
      mine.length ? el("ul", { class: "plain" }, mine.map((m) => el("li", {},
        el("a", { href: `../?w=${m.workspaces.slug}` }, m.workspaces.name), " ", el("span", { class: "pill" }, m.role))))
        : el("p", { class: "muted" }, "You haven't been given access to any projects yet."),
      el("p", { class: "muted" }, "Ask a team admin to add you to more projects or to invite others.")), flash);
  }

  function projectsCard(ov) {
    const slug = el("input", { placeholder: "new-project", "aria-label": "Project short name" });
    const cmdHost = el("div");
    const show = () => { cmdHost.replaceChildren(command(`contexter init ${slugify(slug.value) || "new-project"} --handle <your-name> --team ${team.slug} --template blank`)); };
    return el("section", { class: "card" }, el("h2", {}, "Projects"),
      ov.projects.length ? el("table", {}, el("thead", {}, el("tr", {}, ["Project", "Template", "People"].map((h) => el("th", {}, h)))),
        el("tbody", {}, ov.projects.map((p) => el("tr", {}, el("td", {}, el("a", { href: `../?w=${p.slug}` }, p.name)),
          el("td", {}, el("span", { class: "pill" }, p.template)), el("td", {}, String(p.members))))))
        : el("p", { class: "muted" }, "No projects in this team yet."),
      el("details", {}, el("summary", {}, "Add a project"),
        el("p", { class: "muted" }, "Projects are created from the terminal so they can start from a template. This command puts the new project in this team:"),
        el("div", { class: "row" }, slug, el("button", { type: "button", onclick: show }, "Show command")), cmdHost));
  }

  function peopleCard(ov) {
    const projectName = new Map(ov.projects.map((p) => [p.id, p]));
    const isOwner = myRole === "owner";
    const rows = ov.roster.map((p) => {
      const me = p.user_id === user.id;
      const roleCell = isOwner && !me
        ? el("select", { "aria-label": `Team role for ${p.email}`, onchange: async (e) => {
            if (await run(() => rpc("set_team_member_role", { p_team: team.id, p_user: p.user_id, p_role: e.target.value }))) say("Role updated."); else render(); } },
            ["owner", "admin", "member"].map((r) => el("option", { value: r, selected: r === p.role }, r)))
        : el("span", { class: "pill" }, p.role);
      const have = new Set(p.projects.map((x) => x.workspace_id));
      const chips = p.projects.map((x) => el("span", { class: "chip" }, projectName.get(x.workspace_id)?.name ?? "project",
        x.role === "owner" ? el("span", { class: "pill" }, "owner") : el("select", { "aria-label": `${p.email} on ${projectName.get(x.workspace_id)?.name}`, onchange: async (e) => {
            if (await run(() => rpc("grant_project_access", { p_workspace: x.workspace_id, p_user: p.user_id, p_role: e.target.value }))) say("Access updated."); else render(); } },
          ["editor", "viewer"].map((r) => el("option", { value: r, selected: r === x.role }, r))),
        x.role === "owner" ? null : el("button", { type: "button", "aria-label": `Remove ${p.email} from ${projectName.get(x.workspace_id)?.name}`, title: "Remove access", onclick: async () => {
          if (await run(() => rpc("revoke_project_access", { p_workspace: x.workspace_id, p_user: p.user_id }))) { say("Access removed."); render(); } } }, "×")));
      const addable = ov.projects.filter((pr) => !have.has(pr.id));
      const add = addable.length ? el("select", { "aria-label": `Add ${p.email} to a project`, onchange: async (e) => {
          if (!e.target.value) return;
          if (await run(() => rpc("grant_project_access", { p_workspace: e.target.value, p_user: p.user_id, p_role: "editor" }))) { say("Access added."); render(); } } },
        el("option", { value: "" }, "+ add to project"), addable.map((pr) => el("option", { value: pr.id }, pr.name))) : null;
      const canRemove = me || (myRole === "owner") || (myRole === "admin" && p.role === "member");
      return el("tr", {}, el("td", {}, p.email, me ? el("span", { class: "muted" }, " (you)") : null), el("td", {}, roleCell),
        el("td", {}, el("div", { class: "chips" }, chips, add)),
        el("td", {}, canRemove ? el("button", { type: "button", class: "danger", onclick: async () => {
          if (!confirm(me ? "Leave this team?" : `Remove ${p.email} from the team? They lose the project access the team gave them.`)) return;
          if (await run(() => rpc("remove_team_member", { p_team: team.id, p_user: p.user_id }))) { say(me ? "You left the team." : "Member removed."); await loadTeams(); render(); } } }, me ? "Leave" : "Remove") : null));
    });
    return el("section", { class: "card" }, el("h2", {}, "People"),
      el("div", { style: "overflow-x:auto" }, el("table", {}, el("thead", {}, el("tr", {}, ["Person", "Team role", "Project access", ""].map((h) => el("th", {}, h)))), el("tbody", {}, rows))));
  }

  function inviteCard(ov) {
    const emails = el("textarea", { placeholder: "priya@example.com, sam@example.com", "aria-label": "Email addresses", required: true });
    const role = el("select", { "aria-label": "Team role for the invitees" }, el("option", { value: "member" }, "member"),
      myRole === "owner" ? el("option", { value: "admin" }, "admin") : null);
    const checks = ov.projects.map((p) => {
      const box = el("input", { type: "checkbox", "aria-label": `Give access to ${p.name}`, checked: team.new_member_access === "all_projects" });
      const level = el("select", { "aria-label": `Role on ${p.name}` }, el("option", { value: "editor" }, "editor"), el("option", { value: "viewer" }, "viewer"));
      return { p, box, level, li: el("li", {}, box, el("span", {}, p.name), level) };
    });
    const result = el("ul", { class: "plain" });
    const send = el("button", { type: "submit", class: "primary" }, "Send invitations");
    return el("section", { class: "card" }, el("h2", {}, "Invite people"),
      el("form", { onsubmit: async (e) => {
        e.preventDefault();
        const list = [...new Set(emails.value.split(/[\s,;]+/).map((x) => x.trim().toLowerCase()).filter(Boolean))];
        if (!list.length) return;
        send.disabled = true; send.textContent = "Sending…";
        try {
          const out = await callFunction("invite-members", { team: team.id, emails: list, team_role: role.value,
            grants: checks.filter((c) => c.box.checked).map((c) => ({ workspace_id: c.p.id, role: c.level.value })) });
          result.replaceChildren(...out.invited.map((i) => el("li", { class: i.mail === "sent" ? "status-ok" : "status-err" },
            `${i.email}: ${i.mail === "sent" ? "invitation sent" : `saved, but the email failed (${i.error}). They can still accept by signing in.`}`)));
          emails.value = "";
          const { data: inv } = await sb.from("email_invites").select("*").eq("team_id", team.id).eq("status", "pending");
          say(`${out.invited.length} invitation${out.invited.length === 1 ? "" : "s"} recorded.`);
          render();
        } catch (err) { say(err.message, true); } finally { send.disabled = false; send.textContent = "Send invitations"; }
      } },
        el("label", { class: "field" }, "Email addresses", el("span", { class: "hint" }, "Separate with commas, spaces or new lines."), emails),
        el("label", { class: "field" }, "Team role", role),
        ov.projects.length ? el("fieldset", { style: "border:0;padding:0;margin:0 0 12px" }, el("legend", { class: "muted", style: "padding:0;font-weight:600" }, "Project access"),
          el("ul", { class: "checks" }, checks.map((c) => c.li))) : el("p", { class: "muted" }, "Add a project first to grant access on invitation."),
        send), result);
  }

  function pendingCard(invites, ov) {
    const names = new Map(ov.projects.map((p) => [p.id, p.name]));
    return el("section", { class: "card" }, el("h2", {}, "Waiting to join"),
      invites.length ? el("table", {}, el("thead", {}, el("tr", {}, ["Email", "Access", ""].map((h) => el("th", {}, h)))),
        el("tbody", {}, invites.map((i) => el("tr", {}, el("td", {}, i.email, el("div", { class: "muted" }, `expires ${new Date(i.expires_at).toLocaleDateString()}`)),
          el("td", {}, (i.grants ?? []).map((g) => `${names.get(g.workspace_id) ?? "project"} (${g.role})`).join(", ") || "team only"),
          el("td", { class: "actions" },
            el("button", { type: "button", class: "link", onclick: async () => {
              if (await run(async () => { await callFunction("invite-members", { team: team.id, emails: [i.email], team_role: i.team_role, grants: i.grants }); })) { say(`Resent to ${i.email}.`); render(); } } }, "Resend"),
            el("button", { type: "button", class: "link danger", onclick: async () => {
              if (await run(() => rpc("revoke_invite", { p_invite: i.id }))) { say("Invitation revoked."); render(); } } }, "Revoke"))))))
        : el("p", { class: "muted" }, "Nobody is waiting. Invitations show up here until accepted."));
  }

  function settingsCard() {
    const all = el("input", { type: "checkbox", checked: team.new_member_access === "all_projects", onchange: async (e) => {
      const next = e.target.checked ? "all_projects" : "none";
      const { error } = await sb.from("teams").update({ new_member_access: next }).eq("id", team.id);
      if (error) { e.target.checked = !e.target.checked; say(error.message, true); return; }
      team.new_member_access = next; say("Team default saved.");
    } });
    return el("section", { class: "card" }, el("h2", {}, "Team defaults"),
      el("label", { style: "display:flex;gap:8px;align-items:center" }, all, "New members get editor access to every project in the team"),
      el("p", { class: "muted" }, "Applies to people who accept from now on. Existing members keep what they have."),
      el("details", {}, el("summary", {}, "Create another team"), createTeamCard()));
  }

  await loadTeams();
  await render();
</script>
</body>
</html>
